<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b7d5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Baby Solids Tracker</title>
<style>
:root{--green:#6b7d5c;--light:#f5f7f2;--card:#fff;--text:#253025;--muted:#687368;--line:#dfe5dc;--danger:#a84d45}
*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--green);color:#fff;padding:18px 18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:23px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
main{max-width:720px;margin:auto;padding:16px 16px 90px}.tabs{display:flex;gap:7px;margin-bottom:15px}.tab{flex:1;border:0;border-radius:12px;padding:11px;background:#e8ede4;color:var(--text);font-weight:700}.tab.active{background:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;background:#eef2eb}.num{font-size:27px;font-weight:800}.label{font-size:12px;color:var(--muted)}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:16px;margin:0 0 7px}.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5c8;border-radius:11px;background:#fff;font:inherit}textarea{min-height:80px;resize:vertical}
.food{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.food:last-child{border:0}.food input{width:22px;height:22px}.food button{background:none;border:0;text-align:left;padding:0;flex:1;color:inherit;font:inherit}.emoji{font-size:27px}.pill{font-size:11px;background:#edf2e9;border-radius:20px;padding:4px 8px;color:#536050}
button.primary{border:0;background:var(--green);color:#fff;border-radius:11px;padding:12px 15px;font-weight:800}button.secondary{border:1px solid #ccd5c8;background:#fff;border-radius:11px;padding:11px 14px;font-weight:700}
dialog{border:0;border-radius:18px;width:min(94%,560px);padding:0;box-shadow:0 15px 50px #0005}dialog::backdrop{background:#0007}.modal{padding:20px}.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check input{width:20px}
.empty{padding:25px 5px;text-align:center;color:var(--muted)}.warn{background:#fff4df;border:1px solid #efd39c;border-radius:13px;padding:12px;font-size:13px;margin-top:12px}.allergen{color:#8a4e1e;font-size:12px;font-weight:700}.datehead{font-weight:800;margin:16px 0 6px}
.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:30px;box-shadow:0 5px 18px #0003}
.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>🥣 Baby Solids Tracker</h1><p>Simple food + meal tracking for starting solids</p></header>
<main>
<div class="tabs">
<button class="tab active" data-tab="home">Home</button><button class="tab" data-tab="foods">Foods</button><button class="tab" data-tab="meals">Meals</button>
</div>
<section id="home"></section>
<section id="foods" class="hidden"></section>
<section id="meals" class="hidden"></section>
</main>
<dialog id="foodDialog"><div class="modal" id="foodModal"></div></dialog>
<dialog id="mealDialog"><div class="modal">
<h2>Log a meal</h2>
<label>Date<input id="mealDate" type="date"></label><br>
<label>Time<input id="mealTime" type="time"></label><br>
<label>Foods</label><div id="mealFoods"></div>
<label>Notes<textarea id="mealNotes" placeholder="Texture, amount, reaction, etc."></textarea></label>
<div class="actions"><button class="secondary" onclick="mealDialog.close()">Cancel</button><button class="primary" onclick="saveMeal()">Save meal</button></div>
</div></dialog>
<button class="fab hidden" id="fab" onclick="openMeal()">+</button>
<script>
const foods=[
["avocado","🥑","Avocado","Fruit","Mash very ripe avocado until smooth, or offer a soft graspable piece if developmentally ready.","Soft and ripe; supervise closely.","No",""],
["banana","🍌","Banana","Fruit","Mash ripe banana or offer a soft strip that baby can grasp.","Remove peel; use ripe, soft fruit.","No",""],
["sweet-potato","🍠","Sweet potato","Vegetable","Cook until very soft, then mash or offer soft sticks.","Cool before serving; no added salt.","No",""],
["carrot","🥕","Carrot","Vegetable","Steam or roast until easily squished between fingers; mash or serve soft sticks.","Raw carrot is a choking hazard.","No",""],
["peas","🫛","Peas","Vegetable","Cook until soft and mash. Whole peas can be difficult for beginners.","Squish/flatten for early eaters.","No",""],
["egg","🥚","Egg","Protein","Cook egg thoroughly. Start with a small amount of soft scrambled egg or mashed hard-boiled egg.","Cook fully; introduce common allergens in age-appropriate form.","Yes",""],
["chicken","🍗","Chicken","Protein","Cook thoroughly and shred very finely, or puree/moisten with breast milk, formula, or water.","No whole chunks or bones.","No",""],
["oatmeal","🥣","Oatmeal","Grain","Cook oats until very soft and thin with breast milk, formula, or water.","Avoid added sugar or honey.","No",""],
["yogurt","🥛","Plain whole-milk yogurt","Dairy","Offer plain, pasteurized, full-fat yogurt by spoon.","Choose unsweetened; dairy is an allergen.","Yes",""],
["peanut","🥜","Peanut butter","Allergen","Thin smooth peanut butter with water, breast milk, or formula; offer a small amount by spoon.","Never give a spoonful of thick peanut butter; severe eczema/egg allergy: ask clinician first.","Yes",""],
["strawberry","🍓","Strawberry","Fruit","Mash or finely chop very ripe strawberry; soft pieces can be offered when ready.","Soft, ripe fruit; supervise.","No",""],
["pear","🍐","Pear","Fruit","Use ripe soft pear, mashed or cooked until soft.","Firm/raw pear can be hard; cook if needed.","No",""],
["broccoli","🥦","Broccoli","Vegetable","Steam until very soft. Offer a large soft floret for grasping or mash.","Cook until soft enough to squish.","No",""],
["lentils","🫘","Lentils","Protein","Cook until very soft and mash; thin as needed.","Plain, low-sodium preparation.","No",""],
["tofu","🧊","Tofu","Protein","Offer soft tofu mashed or in soft strips.","Use plain, soft tofu; supervise.","Yes",""],
["wheat","🌾","Wheat","Grain","Offer soft wheat foods such as well-cooked cereal or soft pasta prepared to an appropriate texture.","Avoid hard/dry pieces.","Yes",""],
["apple","🍎","Apple","Fruit","Cook until very soft, then puree, mash, or serve soft cooked pieces.","Raw apple is a choking hazard for infants.","No",""],
["mango","🥭","Mango","Fruit","Use very ripe mango mashed or cut into soft graspable pieces.","Remove skin and pit; supervise.","No",""],
["peach","🍑","Peach","Fruit","Use ripe, soft peach mashed or cut into soft pieces.","Remove pit and tough skin.","No",""],
["plum","🟣","Plum","Fruit","Use ripe, soft plum mashed or finely chopped.","Remove pit; avoid firm/raw pieces.","No",""],
["nectarine","🍑","Nectarine","Fruit","Use ripe, soft nectarine mashed or finely chopped.","Remove pit; cook if not soft enough.","No",""],
["blueberry","🫐","Blueberry","Fruit","Mash berries or cook until soft and squish them; avoid serving whole round berries.","Whole round berries can be a choking hazard.","No",""],
["raspberry","🫐","Raspberry","Fruit","Mash very ripe raspberries or finely chop them.","Supervise; mash if needed for easier swallowing.","No",""],
["blackberry","🫐","Blackberry","Fruit","Mash very ripe blackberries or finely chop them.","Check for large pieces and tough seeds.","No",""],
["watermelon","🍉","Watermelon","Fruit","Offer soft, seedless watermelon in thin soft pieces or mash.","Remove seeds and rind; never serve hard chunks.","No",""],
["cantaloupe","🍈","Cantaloupe","Fruit","Use ripe, soft melon mashed or cut into thin soft pieces.","Remove rind and seeds.","No",""],
["orange","🍊","Orange","Fruit","Remove peel, membrane, and seeds; mash or offer very soft small pieces.","Remove tough membrane and seeds.","No",""],
["kiwi","🥝","Kiwi","Fruit","Scoop ripe kiwi and mash or finely chop.","Use ripe, soft fruit; supervise.","No",""],
["pineapple","🍍","Pineapple","Fruit","Use very ripe pineapple, finely chopped or cooked until soft.","Avoid tough/fibrous chunks; remove core and skin.","No",""],
["papaya","🧡","Papaya","Fruit","Mash ripe papaya or offer soft small pieces.","Remove skin and seeds.","No",""],
["apricot","🍑","Apricot","Fruit","Use ripe, soft apricot mashed or finely chopped.","Remove pit; cook if firm.","No",""],
["cherries","🍒","Cherries","Fruit","Cook or finely chop very soft cherries after removing the pit.","Never serve whole; remove pits completely.","No",""],
["zucchini","🥒","Zucchini","Vegetable","Steam or roast until very soft; mash or offer soft sticks.","Raw firm zucchini can be difficult to manage.","No",""],
["yellow-squash","🌱","Yellow squash","Vegetable","Cook until very soft and mash or cut into soft pieces.","No raw firm pieces.","No",""],
["butternut-squash","🎃","Butternut squash","Vegetable","Roast or steam until fork-soft; mash or serve soft pieces.","Remove skin and seeds.","No",""],
["acorn-squash","🎃","Acorn squash","Vegetable","Roast or steam until very soft; mash or scoop from the skin.","Remove skin and seeds.","No",""],
["pumpkin","🎃","Pumpkin","Vegetable","Cook plain pumpkin until soft and puree or mash.","Use plain pumpkin; avoid added sugar or salt.","No",""],
["green-beans","🫛","Green beans","Vegetable","Steam until very soft and mash or offer long soft pieces.","Cook until easily squished.","No",""],
["spinach","🥬","Spinach","Vegetable","Cook spinach until soft and finely chop or puree.","Avoid large stringy pieces.","No",""],
["cauliflower","🥦","Cauliflower","Vegetable","Steam until very soft; mash or offer a soft floret.","Cook until easily squished.","No",""],
["beets","🫜","Beets","Vegetable","Cook until very soft and puree, mash, or finely chop.","Remove tough skin; expect temporary stool color changes.","No",""],
["potato","🥔","Potato","Vegetable","Bake, boil, or steam until very soft; mash with breast milk, formula, or water.","Avoid added salt; remove tough skin.","No",""],
["bell-pepper","🫑","Bell pepper","Vegetable","Cook until soft and finely chop or offer a soft cooked strip.","Raw pepper can be firm; cook for beginners.","No",""],
["corn","🌽","Corn","Vegetable","Cook corn and mash or finely chop kernels.","Whole corn kernels can be a choking hazard.","No",""],
["asparagus","🌿","Asparagus","Vegetable","Steam until very soft; offer a soft spear or finely chop.","Remove tough ends; cook until soft.","No",""],
["edamame","🫛","Edamame","Protein","Cook until very soft, remove beans from pods, and mash thoroughly.","Do not give the whole pod; soy is an allergen.","Yes",""],
["beef","🥩","Beef","Protein","Cook thoroughly and finely shred, mince, puree, or moisten with broth/water.","Remove fat, gristle, and all bones; avoid tough chunks.","No",""],
["turkey","🦃","Turkey","Protein","Cook thoroughly and finely shred or puree with moisture.","Remove skin, fat, gristle, and bones.","No",""],
["pork","🍖","Pork","Protein","Cook thoroughly and finely shred or puree with moisture.","Avoid tough pieces; remove bones and excess fat.","No",""],
["lamb","🍖","Lamb","Protein","Cook thoroughly and finely shred or mince; moisten as needed.","Remove bones, gristle, and tough pieces.","No",""],
["salmon","🐟","Salmon","Fish","Cook thoroughly, remove every bone and skin, then flake very finely.","Check carefully for bones; fish is a common allergen.","Yes",""],
["cod","🐟","Cod","Fish","Cook thoroughly, debone completely, and flake into very soft pieces.","Check carefully for bones; fish is a common allergen.","Yes",""],
["tilapia","🐟","Tilapia","Fish","Cook thoroughly, remove every bone, and flake finely.","Check carefully for bones; fish is a common allergen.","Yes",""],
["shrimp","🦐","Shrimp","Shellfish","Cook thoroughly, remove shell and tail, and finely chop or puree.","Shellfish is a common allergen; never serve whole or rubbery pieces.","Yes",""],
["black-beans","🫘","Black beans","Protein","Cook until very soft and mash or puree with water.","Whole beans can be a choking hazard; mash thoroughly.","No",""],
["chickpeas","🫘","Chickpeas","Protein","Cook until very soft and puree or mash smooth.","Whole chickpeas can be a choking hazard.","No",""],
["kidney-beans","🫘","Kidney beans","Protein","Use fully cooked, very soft beans and mash or puree.","Never serve whole; use plain, low-sodium beans.","No",""],
["brown-rice","🍚","Brown rice","Grain","Cook until very soft and mash or blend with water, breast milk, or formula.","Avoid dry or hard grains.","No",""],
["white-rice","🍚","White rice","Grain","Cook until very soft and mash or serve in a soft, cohesive texture.","Avoid dry, loose hard grains.","No",""],
["quinoa","🌾","Quinoa","Grain","Cook until very soft and mash with water or puree into another food.","Cook thoroughly; use a soft texture.","No",""],
["barley","🌾","Barley","Grain","Cook until very soft and finely mash or puree.","Whole cooked kernels can be difficult to swallow.","No",""],
["whole-wheat-pasta","🍝","Whole-wheat pasta","Grain","Cook pasta until very soft, then finely chop or mash.","Avoid firm/al dente pasta; cut into small soft pieces.","Yes",""],
["rice-cereal","🥣","Iron-fortified infant rice cereal","Grain","Mix prepared infant cereal with breast milk, formula, or water to a smooth texture.","Offer a variety of iron-fortified grains rather than relying only on rice cereal.","No",""],
["barley-cereal","🥣","Iron-fortified barley cereal","Grain","Mix prepared infant cereal with breast milk, formula, or water to a smooth texture.","Serve smooth and age-appropriate.","No",""],
["multigrain-cereal","🥣","Iron-fortified multigrain cereal","Grain","Prepare according to package directions and thin with breast milk, formula, or water.","Choose infant cereal without added sugar or honey.","Yes",""],
["cottage-cheese","🧀","Cottage cheese","Dairy","Offer pasteurized full-fat cottage cheese mashed or blended to a smoother texture.","Choose lower-sodium/plain when possible; dairy is an allergen.","Yes",""],
["ricotta","🧀","Ricotta cheese","Dairy","Offer pasteurized full-fat ricotta by spoon or mixed into a soft puree.","Choose plain; dairy is an allergen.","Yes",""],
["cheddar","🧀","Cheddar cheese","Dairy","Use pasteurized mild cheddar, finely grated or very thinly sliced and softened.","Avoid large or rubbery chunks; dairy is an allergen.","Yes",""],
["almond-butter","🌰","Almond butter","Allergen","Thin smooth almond butter with water, breast milk, or formula and offer a small amount.","Never give a thick spoonful; tree nut allergen.","Yes",""],
["cashew-butter","🌰","Cashew butter","Allergen","Thin smooth cashew butter with water, breast milk, or formula.","Never give a thick spoonful; tree nut allergen.","Yes",""],
["tahini","🫘","Tahini (sesame)","Allergen","Thin smooth tahini with water or mix into a soft puree.","Sesame is a common allergen; avoid thick spoonfuls.","Yes",""],
["soy-yogurt","🥛","Plain soy yogurt","Allergen","Offer plain, unsweetened, fortified soy yogurt by spoon.","Choose unsweetened; soy is an allergen.","Yes",""]
];
let state=JSON.parse(localStorage.getItem("babySolidsState")||'{"tried":[],"meals":[]}');
const save=()=>localStorage.setItem("babySolidsState",JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(){
 const tried=new Set(state.tried);
 home.innerHTML=`<div class="card"><h2>Today</h2><div class="stats"><div class="stat"><div class="num">${tried.size}/${foods.length}</div><div class="label">foods tried</div></div><div class="stat"><div class="num">${state.meals.filter(m=>m.date===today()).length}</div><div class="label">meals today</div></div></div><div class="warn">⚠️ Breast milk or infant formula remains the main source of nutrition from 6–12 months. Always supervise eating and use textures appropriate for your baby's development.</div></div>
 <div class="card"><h2>Getting started</h2><p class="small">Check a food when you've introduced it. Tap any food for serving and safety guidance. Use Meals to keep a simple history.</p><button class="primary" onclick="switchTab('foods')">Browse foods</button></div>`;
 foodsSection.innerHTML=`<div class="card"><input id="search" placeholder="Search foods…" oninput="renderFoods()"></div><div class="card" id="foodList"></div>`;
 renderFoods(); renderMeals();
}
function renderFoods(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();
 const tried=new Set(state.tried);
 const list=foods.filter(f=>f[2].toLowerCase().includes(q)||f[3].toLowerCase().includes(q));
 foodList.innerHTML=list.map(f=>`<div class="food"><input type="checkbox" ${tried.has(f[0])?"checked":""} onchange="toggleTried('${f[0]}',this.checked)"><span class="emoji">${f[1]}</span><button onclick="openFood('${f[0]}')"><strong>${esc(f[2])}</strong><br><span class="small">${esc(f[3])}${f[5]==="Yes"?' · <span class="allergen">Common allergen</span>':''}</span></button></div>`).join("")||'<div class="empty">No foods found.</div>';
}
function toggleTried(id,checked){state.tried=checked?[...new Set([...state.tried,id])]:state.tried.filter(x=>x!==id);save();render();}
function openFood(id){let f=foods.find(x=>x[0]===id);foodModal.innerHTML=`<h2>${f[1]} ${esc(f[2])}</h2><span class="pill">${esc(f[3])}</span>${f[5]==="Yes"?'<p class="allergen">⚠️ Common allergen</p>':''}<h3>How to serve</h3><p>${esc(f[4])}</p><h3>Safety</h3><p>${esc(f[6])}</p>${f[7]?`<div class="warn">${esc(f[7])}</div>`:""}<div class="actions"><button class="primary" onclick="foodDialog.close()">Done</button></div>`;foodDialog.showModal();}
function today(){return new Date().toISOString().slice(0,10)}
function openMeal(){mealDate.value=today();mealTime.value=new Date().toTimeString().slice(0,5);mealNotes.value="";mealFoods.innerHTML=foods.map(f=>`<label class="check"><input type="checkbox" value="${f[0]}"> ${f[1]} ${esc(f[2])}</label>`).join("");mealDialog.showModal();}
function saveMeal(){let selected=[...mealFoods.querySelectorAll("input:checked")].map(x=>x.value);if(!selected.length){alert("Select at least one food.");return}state.meals.push({id:Date.now(),date:mealDate.value,time:mealTime.value,foods:selected,notes:mealNotes.value.trim()});selected.forEach(id=>{if(!state.tried.includes(id))state.tried.push(id)});save();mealDialog.close();render();}
function renderMeals(){if(!state.meals.length){meals.innerHTML='<div class="card empty">No meals logged yet.<br>Tap + to add your first meal.</div>';return}
 const groups={};[...state.meals].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).forEach(m=>(groups[m.date]??=[]).push(m));
 meals.innerHTML=Object.entries(groups).map(([d,arr])=>`<div class="datehead">${new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"})}</div>${arr.map(m=>`<div class="card"><div class="row"><strong>${esc(m.time||"Meal")}</strong><span class="grow"></span><button class="secondary" onclick="deleteMeal(${m.id})">Delete</button></div><p>${m.foods.map(id=>{let f=foods.find(x=>x[0]===id);return f?f[1]+" "+esc(f[2]):id}).join(" · ")}</p>${m.notes?`<p class="small">${esc(m.notes)}</p>`:""}</div>`).join("")}`).join("");
}
function deleteMeal(id){if(confirm("Delete this meal?")){state.meals=state.meals.filter(m=>m.id!==id);save();render();}}
function switchTab(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));[home,foodsSection,meals].forEach(x=>x.classList.add("hidden"));({home,foods:foodsSection,meals}[t]).classList.remove("hidden");fab.classList.toggle("hidden",t!=="meals");}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
const home=document.getElementById("home"),foodsSection=document.getElementById("foods"),meals=document.getElementById("meals"),foodDialog=document.getElementById("foodDialog"),foodModal=document.getElementById("foodModal"),mealDialog=document.getElementById("mealDialog"),fab=document.getElementById("fab");
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
render();
</script>
</body></html>
