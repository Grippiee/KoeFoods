<body>
<header><h1>🥣 KoeFoods</h1><p>Food, allergen & meal tracking for starting solids</p></header>
<main>
<div class="tabs">
<button class="tab active" data-tab="home">Home</button>
<button class="tab" data-tab="foods">Foods</button>
<button class="tab" data-tab="meals">Meals</button>
<button class="tab" data-tab="calendar">Calendar</button>
<button class="tab" data-tab="progress">Progress</button>
</div>
<section id="home"></section>
<section id="foods" class="hidden"></section>
<section id="meals" class="hidden"></section>
<section id="calendar" class="hidden"></section>
<section id="progress" class="hidden"></section>
</main>

<dialog id="foodDialog"><div class="modal" id="foodModal"></div></dialog>
<dialog id="mealDialog"><div class="modal">
<h2>Log a meal</h2>
<label>Date<input id="mealDate" type="date"></label><br>
<label>Time<input id="mealTime" type="time"></label><br>
<label>Foods</label><div id="mealFoods"></div>
<label>Notes<textarea id="mealNotes" placeholder="Texture, amount, reaction, etc."></textarea></label>
<div class="actions"><button class="secondary" onclick="mealDialog.close()">Cancel</button><button class="primary" onclick="saveMeal()">Save meal</button></div>
</div></dialog>

<dialog id="reactionDialog"><div class="modal" id="reactionModal"></div></dialog>
<button class="fab hidden" id="fab" onclick="openMeal()">+</button>

let state=JSON.parse(localStorage.getItem("babySolidsState")||'{"tried":[],"meals":[]}');
state.tried=Array.isArray(state.tried)?state.tried:[];
state.meals=Array.isArray(state.meals)?state.meals:[];
state.introducedDates=state.introducedDates||{};
state.reactions=state.reactions||{};
const save=()=>localStorage.setItem("babySolidsState",JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const foodById=id=>foods.find(x=>x[0]===id);
const dateLabel=d=>new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});
const catList=[...new Set(foods.map(f=>f[3]))];

function migrateOldDates(){
  const t=new Set(state.tried);
  t.forEach(id=>{if(!state.introducedDates[id]) state.introducedDates[id]=null;});
  save();
}
migrateOldDates();

function render(){
  const tried=new Set(state.tried);
  const pct=Math.round(tried.size/foods.length*100);
  home.innerHTML=`
  <div class="card"><h2>🥣 Koe's progress</h2>
    <div class="stats">
      <div class="stat"><div class="num">${tried.size}/${foods.length}</div><div class="label">foods tried</div></div>
      <div class="stat"><div class="num">${state.meals.filter(m=>m.date===today()).length}</div><div class="label">meals today</div></div>
    </div>
    <div style="margin-top:14px" class="progress"><div style="width:${pct}%"></div></div>
    <p class="small" style="margin-bottom:0">${pct}% of the food list explored</p>
  </div>
  <div class="card"><h2>⚠️ Quick safety</h2>
    <p class="small">Breast milk or infant formula remains the main source of nutrition from 6–12 months. Supervise every meal and use textures appropriate for your baby's development.</p>
    <p class="small">For severe eczema or egg allergy, talk with your baby's clinician before introducing peanut. For a suspected serious allergic reaction, seek emergency medical care.</p>
  </div>
  <div class="card"><h2>🚀 Quick actions</h2>
    <div class="grid2"><button class="primary" onclick="switchTab('foods')">Browse foods</button><button class="secondary" onclick="openMeal()">Log a meal</button></div>
  </div>
  <div class="card"><h2>🆕 Recently introduced</h2>${recentIntroductions()}</div>`;
  renderFoods(); renderMeals(); renderCalendar(); renderProgress();
}

function recentIntroductions(){
  const rows=state.tried.map(id=>({id,date:state.introducedDates[id]})).filter(x=>x.date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  if(!rows.length) return '<div class="empty">Mark foods as tried to build Koe\'s introduction timeline.</div>';
  return rows.map(x=>{let f=foodById(x.id);return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="emoji">${f[1]}</span><span class="grow"><strong>${esc(f[2])}</strong><br><span class="small">${dateLabel(x.date)}</span></span><span class="pill">${f[5]==="Yes"?"Allergen":"New food"}</span></div>`}).join("");
}

function renderFoods(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();
 const filter=document.getElementById("foodFilter")?.value||"All";
 const tried=new Set(state.tried);
 let list=foods.filter(f=>(f[2].toLowerCase().includes(q)||f[3].toLowerCase().includes(q)) &&
   (filter==="All" || (filter==="Tried"&&tried.has(f[0])) || (filter==="Not tried"&&!tried.has(f[0])) || (filter==="Allergens"&&f[5]==="Yes") || f[3]===filter));
 foodsSection.innerHTML=`<div class="card">
   <input id="search" placeholder="Search foods…" oninput="renderFoods()" value="${esc(q)}">
   <div style="height:8px"></div>
   <select id="foodFilter" onchange="renderFoods()"><option>All</option><option>Tried</option><option>Not tried</option><option>Allergens</option>${catList.map(c=>`<option ${filter===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
 </div><div class="card" id="foodList"></div>`;
 foodList.innerHTML=list.map(f=>`<div class="food">
   <input type="checkbox" ${tried.has(f[0])?"checked":""} onchange="toggleTried('${f[0]}',this.checked)">
   <span class="emoji">${f[1]}</span>
   <button onclick="openFood('${f[0]}')"><strong>${esc(f[2])}</strong><br><span class="small">${esc(f[3])}${f[5]==="Yes"?' · <span class="allergen">Common allergen</span>':''}</span></button>
 </div>`).join("")||'<div class="empty">No foods found.</div>';
}

function toggleTried(id,checked){
 if(checked){
   if(!state.tried.includes(id)) state.tried.push(id);
   if(!state.introducedDates[id]) state.introducedDates[id]=today();
 }else{
   state.tried=state.tried.filter(x=>x!==id);
   delete state.introducedDates[id];
 }
 save();render();
}

function openFood(id){
 let f=foodById(id), tried=state.tried.includes(id), date=state.introducedDates[id], r=state.reactions[id];
 foodModal.innerHTML=`<h2>${f[1]} ${esc(f[2])}</h2>
 <span class="pill">${esc(f[3])}</span>${f[5]==="Yes"?'<p class="allergen">⚠️ Common allergen</p>':''}
 ${tried?`<div class="ok"><strong>✓ Tried</strong><br><span class="small">${date?"First introduced: "+dateLabel(date):"First introduced date not recorded (older entry)."}</span></div>`:""}
 <h3 style="margin-top:16px">How to serve</h3><p>${esc(f[4])}</p>
 <h3>Age & texture progression</h3>
 <p><strong>~6 months:</strong> smooth, mashed, or very soft graspable foods depending on development.</p>
 <p><strong>7–8 months:</strong> thicker mashed textures and soft, small pieces as baby develops more control.</p>
 <p><strong>9–12 months:</strong> continue progressing toward varied soft textures and appropriately sized pieces.</p>
 <p class="small">These are general texture ideas, not a developmental assessment. Follow your baby's readiness and clinician guidance.</p>
 <h3>Safety</h3><p>${esc(f[6])}</p>${f[7]?`<div class="warn">${esc(f[7])}</div>`:""}
 ${r?`<div class="reaction"><strong>Reaction note</strong><br>${esc(r.symptoms)}${r.notes?`<br><span class="small">${esc(r.notes)}</span>`:""}<br><span class="small">${r.date?dateLabel(r.date):""}</span></div>`:""}
 <div class="actions"><button class="secondary" onclick="openReaction('${f[0]}')">Reaction / notes</button><button class="primary" onclick="foodDialog.close()">Done</button></div>`;
 foodDialog.showModal();
}

function openReaction(id){
 let f=foodById(id), r=state.reactions[id]||{};
 reactionModal.innerHTML=`<h2>📝 ${f[1]} ${esc(f[2])}</h2>
 <label>What happened?
 <select id="reactionSymptoms">
   <option value="">No reaction / not sure</option><option>Rash</option><option>Hives</option><option>Vomiting</option><option>Diarrhea</option><option>Swelling</option><option>Breathing difficulty</option><option>Other</option>
 </select></label><br>
 <label>Date<input id="reactionDate" type="date" value="${r.date||today()}"></label><br>
 <label>Notes<textarea id="reactionNotes" placeholder="Amount, timing, texture, what you noticed...">${esc(r.notes||"")}</textarea></label>
 <div class="warn">If baby has trouble breathing, significant swelling, or other signs of a severe allergic reaction, seek emergency medical care.</div>
 <div class="actions"><button class="secondary" onclick="reactionDialog.close()">Cancel</button><button class="primary" onclick="saveReaction('${id}')">Save</button></div>`;
 document.getElementById("reactionSymptoms").value=r.symptoms||"";
 reactionDialog.showModal();
}

function saveReaction(id){
 const symptoms=document.getElementById("reactionSymptoms").value;
 const notes=document.getElementById("reactionNotes").value.trim();
 const date=document.getElementById("reactionDate").value||today();
 if(!symptoms&&!notes){delete state.reactions[id];}
 else state.reactions[id]={symptoms,notes,date};
 save();reactionDialog.close();render();openFood(id);
}

function openMeal(){
 mealDate.value=today();mealTime.value=new Date().toTimeString().slice(0,5);mealNotes.value="";
 mealFoods.innerHTML=foods.map(f=>`<label class="check"><input type="checkbox" value="${f[0]}"> ${f[1]} ${esc(f[2])}</label>`).join("");
 mealDialog.showModal();
}

function saveMeal(){
 let selected=[...mealFoods.querySelectorAll("input:checked")].map(x=>x.value);
 if(!selected.length){alert("Select at least one food.");return}
 state.meals.push({id:Date.now(),date:mealDate.value,time:mealTime.value,foods:selected,notes:mealNotes.value.trim()});
 selected.forEach(id=>{if(!state.tried.includes(id)){state.tried.push(id);state.introducedDates[id]=mealDate.value;}});
 save();mealDialog.close();render();
}

function renderMeals(){
 if(!state.meals.length){meals.innerHTML='<div class="card empty">No meals logged yet.<br>Tap + to add your first meal.</div>';return}
 const groups={};[...state.meals].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).forEach(m=>(groups[m.date]??=[]).push(m));
 meals.innerHTML=Object.entries(groups).map(([d,arr])=>`<div class="datehead">${dateLabel(d)}</div>${arr.map(m=>`<div class="card"><div class="row"><strong>${esc(m.time||"Meal")}</strong><span class="grow"></span><button class="secondary danger" onclick="deleteMeal(${m.id})">Delete</button></div><p>${m.foods.map(id=>{let f=foodById(id);return f?f[1]+" "+esc(f[2]):id}).join(" · ")}</p>${m.notes?`<p class="small">${esc(m.notes)}</p>`:""}</div>`).join("")}`).join("");
}

function deleteMeal(id){if(confirm("Delete this meal?")){state.meals=state.meals.filter(m=>m.id!==id);save();render();}}

let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function renderCalendar(){
 const y=calMonth.getFullYear(),m=calMonth.getMonth();
 const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate(), offset=first.getDay();
 const mealDates=new Set(state.meals.map(x=>x.date)), introDates=new Set(Object.values(state.introducedDates).filter(Boolean));
 let cells="";
 ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>cells+=`<div class="calhead">${d}</div>`);
 for(let i=0;i<offset;i++) cells+=`<div class="calday muted"></div>`;
 for(let d=1;d<=days;d++){
   const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
   const isToday=ds===today();
   cells+=`<div class="calday ${isToday?"today":""}"><strong>${d}</strong><div style="margin-top:7px">${mealDates.has(ds)?'<span class="dot" title="Meal logged"></span>':''}${introDates.has(ds)?'<span class="dot" title="Food introduced"></span>':''}</div></div>`;
 }
 calendar.innerHTML=`<div class="card"><div class="row"><button class="secondary" onclick="changeMonth(-1)">‹</button><strong class="grow" style="text-align:center">${calMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</strong><button class="secondary" onclick="changeMonth(1)">›</button></div><div style="height:12px"></div><div class="calendar">${cells}</div><div style="height:10px"></div><div class="legend"><span><i class="dot"></i> meal</span><span><i class="dot"></i> food introduced</span></div></div>
 <div class="card"><h2>Introduction dates</h2>${Object.entries(state.introducedDates).filter(([id,d])=>d&&new Date(d).getMonth()===m&&new Date(d).getFullYear()===y).sort((a,b)=>a[1].localeCompare(b[1])).map(([id,d])=>{let f=foodById(id);return f?`<div class="row" style="padding:7px 0"><span>${f[1]}</span><span class="grow">${esc(f[2])}</span><span class="small">${new Date(d+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></div>`:""}).join("")||'<div class="empty">No introduction dates recorded this month.</div>'}</div>`;
}
function changeMonth(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);renderCalendar();}

function renderProgress(){
 const tried=new Set(state.tried), pct=Math.round(tried.size/foods.length*100);
 const cats=catList.map(c=>{let all=foods.filter(f=>f[3]===c),done=all.filter(f=>tried.has(f[0])).length;return `<div style="margin:12px 0"><div class="row"><strong class="grow">${esc(c)}</strong><span class="small">${done}/${all.length}</span></div><div class="progress"><div style="width:${Math.round(done/all.length*100)}%"></div></div></div>`}).join("");
 const allergens=foods.filter(f=>f[5]==="Yes"), adone=allergens.filter(f=>tried.has(f[0])).length;
 progress.innerHTML=`<div class="card"><h2>📊 Overall progress</h2><div class="num">${tried.size}/${foods.length}</div><div class="progress" style="margin-top:8px"><div style="width:${pct}%"></div></div><p class="small">${pct}% tried</p>${cats}</div>
 <div class="card"><h2>⚠️ Allergen center</h2><p class="small">${adone}/${allergens.length} foods in the app marked as common allergens have been introduced.</p>${allergens.map(f=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="emoji">${f[1]}</span><span class="grow"><strong>${esc(f[2])}</strong><br><span class="small">${tried.has(f[0])?(state.introducedDates[f[0]]?"Introduced "+dateLabel(state.introducedDates[f[0]]):"Tried; date not recorded"):"Not introduced"}</span></span><button class="secondary" onclick="openFood('${f[0]}')">View</button></div>`).join("")}</div>
 <div class="card"><h2>🧭 What to try next</h2><div class="small">Pick any food below that has not been checked yet.</div><div style="height:8px"></div>${foods.filter(f=>!tried.has(f[0])).slice(0,8).map(f=>`<button class="filter" onclick="openFood('${f[0]}')">${f[1]} ${esc(f[2])}</button>`).join(" ")||'<div class="empty">You have checked every food in this list!</div>'}</div>`;
}

function switchTab(t){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
 [home,foodsSection,meals,calendar,progress].forEach(x=>x.classList.add("hidden"));
 ({home,foods:foodsSection,meals,calendar,progress}[t]).classList.remove("hidden");
 fab.classList.toggle("hidden",t!=="meals");
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
const home=document.getElementById("home"),foodsSection=document.getElementById("foods"),meals=document.getElementById("meals"),calendar=document.getElementById("calendar"),progress=document.getElementById("progress"),foodDialog=document.getElementById("foodDialog"),foodModal=document.getElementById("foodModal"),mealDialog=document.getElementById("mealDialog"),reactionDialog=document.getElementById("reactionDialog"),reactionModal=document.getElementById("reactionModal"),fab=document.getElementById("fab");
render();
</script>
</body></html>
